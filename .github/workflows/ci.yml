name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # 目前这个仓库没有单测,go test 会以 "no test files" 通过,
      # 保留这一步是为了以后加了用例能自动跑起来。
      - name: Test
        run: go test -count=1 -timeout 300s ./...
